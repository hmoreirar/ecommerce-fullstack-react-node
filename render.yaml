# Blueprint de Render: API + PostgreSQL.
# Crear desde Render > New > Blueprint (o conectar cada servicio a mano).
services:
  - type: web
    name: nicommerce-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    preDeployCommand: npm run migrate # was : releaseCommand
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
        #length: 48
      - key: DATABASE_URL
        fromDatabase:
          name: nicommerce-db
          property: connectionString
      # Reemplazar con la URL real de Vercel tras el primer deploy.
      - key: FRONTEND_URL
        value: https://REEMPLAZAR.vercel.app

databases:
  - name: nicommerce-db
    plan: free
    databaseName: ecommerce
